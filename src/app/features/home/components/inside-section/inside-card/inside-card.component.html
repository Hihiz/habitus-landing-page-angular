<div class="inside-card">
  <img
    class="bg-shape"
    [src]="card().innerIconSrc"
    [alt]="card().innerIconAlt"
    width="280"
    height="521"
    loading="lazy"
    aria-hidden="true"
  />

  <img
    class="phone-screen"
    [src]="card().iconSrc"
    [alt]="card().iconAlt"
    [height]="card().height"
    [width]="card().width"
    loading="lazy"
  />
</div>
