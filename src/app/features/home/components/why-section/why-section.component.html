<section class="section why-section">
  <div class="container">
    <div class="section-title">
      <h2 class="section-title-text">Why you’ll love it</h2>
      <p class="section-title-description">Designed to help you stay on track, effortlessly.</p>
    </div>
    <div class="card-grid">
      @for (card of cardWhy(); track card.id) {
        <app-why-card [cardWhy]="card" />
      }
    </div>
  </div>
</section>
